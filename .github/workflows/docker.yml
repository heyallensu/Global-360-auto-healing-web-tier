name: Docker

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup QEMU v4
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Setup Buildx v4
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to GHCR v4
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata v6
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ghcr.io/heyallensu/global-360-auto-healing-web-tier
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push v7
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Setup Trivy v0.2.6
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        if: github.event_name == 'push'
        with:
          version: v0.69.3

      - name: Scan pushed image digest
        if: github.event_name == 'push'
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL ghcr.io/heyallensu/global-360-auto-healing-web-tier@${{ steps.build.outputs.digest }}
